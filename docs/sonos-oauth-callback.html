<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenSonos OAuth Bridge</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 720px;
      margin: 48px auto;
      padding: 0 20px;
      line-height: 1.5;
      color: #1c1c1e;
    }
    code {
      background: #f2f2f7;
      padding: 2px 6px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <h1>OpenSonos OAuth Bridge</h1>
  <p>Returning to the OpenSonos app...</p>
  <p>If nothing happens, make sure OpenSonos is installed and that this page is registered as the Sonos redirect URL.</p>

  <script>
    const current = new URL(window.location.href)
    const next = new URL('opensonos://oauth-callback')

    for (const [key, value] of current.searchParams.entries()) {
      next.searchParams.set(key, value)
    }

    window.location.replace(next.toString())
  </script>
</body>
</html>
